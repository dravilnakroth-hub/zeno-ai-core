<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeno</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{
    --teal:#43c0a0;
    --sage:#4b8f42;
    --teal-dark:#0e2814;
    --bg:#0a0f0d;
    --card:#121815;
    --card-2:#1a221e;
    --border:rgba(67,192,160,0.22);
    --text-primary:#f2f5f3;
    --text-secondary:rgba(242,245,243,0.62);
    --text-muted:rgba(242,245,243,0.4);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text-primary);
    overflow:hidden;
  }
  .app{
    width:100%;
    max-width:460px;
    margin:0 auto;
    height:100vh;
    height:100dvh;
    position:relative;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    box-shadow:
      0 0 18px 2px rgba(67,192,160,0.35),
      0 0 40px 6px rgba(67,192,160,0.18);
    animation:borderGlow 3.2s ease-in-out infinite;
  }
  @keyframes borderGlow{
    0%,100%{
      box-shadow:
        0 0 18px 2px rgba(67,192,160,0.35),
        0 0 40px 6px rgba(67,192,160,0.18);
    }
    50%{
      box-shadow:
        0 0 28px 4px rgba(67,192,160,0.55),
        0 0 60px 10px rgba(67,192,160,0.28);
    }
  }
  .screen{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    padding:28px 24px;
    animation:fadeIn 0.35s ease;
    overflow-y:auto;
  }
  .screen.active{display:flex;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* Logo */
  .logo-wrap{display:flex;justify-content:center;margin:36px 0 8px;}
  .logo-wrap svg{width:96px;height:96px;}
  .brand-name{text-align:center;font-size:22px;font-weight:500;letter-spacing:0.02em;margin-bottom:4px;}
  .brand-tag{text-align:center;font-size:14px;color:var(--text-secondary);margin-bottom:32px;}

  /* Auth forms */
  .auth-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:13px;color:var(--text-secondary);}
  .field input{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    color:var(--text-primary);
    font-size:15px;
    outline:none;
    transition:border-color 0.2s;
  }
  .field input:focus{border-color:var(--teal);}
  .field input::placeholder{color:var(--text-muted);}
  .error-msg{font-size:12px;color:#ff8a8a;min-height:16px;}

  .btn-primary{
    background:linear-gradient(135deg,var(--teal),var(--sage));
    color:#08130c;
    border:none;
    border-radius:var(--radius);
    padding:15px;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    margin-top:8px;
  }
  .btn-primary:active{opacity:0.85;}

  .switch-link{
    text-align:center;
    margin-top:22px;
    font-size:14px;
    color:var(--text-secondary);
  }
  .switch-link span{color:var(--teal);cursor:pointer;font-weight:500;}

  .divider{
    display:flex;align-items:center;gap:12px;
    color:var(--text-muted);font-size:12px;margin:18px 0;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border);}

  .btn-google{
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:13px;
    color:var(--text-primary);
    font-size:14px;
    cursor:pointer;
  }

  /* Chat screen */
  .chat-screen{padding:0; overflow:hidden;}
  .chat-header{
    display:flex;align-items:center;gap:12px;
    padding:18px 20px;
    border-bottom:1px solid var(--border);
    background:var(--bg);
  }
  .chat-header svg{width:40px;height:40px;flex-shrink:0;}
  .chat-header-info{flex:1;}
  .chat-header-name{font-size:16px;font-weight:500;}
  .chat-header-status{font-size:12px;color:var(--teal);display:flex;align-items:center;gap:5px;}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);display:inline-block;}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-secondary);cursor:pointer;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);
    transition:transform 0.12s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .icon-btn:active{transform:scale(0.9);}
  .icon-btn:hover{border-color:rgba(67,192,160,0.5);color:var(--text-primary);}

  .messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .msg-row{display:flex;gap:8px;max-width:82%;}
  .msg-row.user{align-self:flex-end;flex-direction:row-reverse;}
  .msg-row.bot{align-self:flex-start;}
  .msg-avatar{width:28px;height:28px;flex-shrink:0;margin-top:2px;}
  .bubble{
    padding:12px 15px;
    border-radius:16px;
    font-size:15px;
    line-height:1.5;
  }
  .msg-row.bot .bubble{
    background:var(--card-2);
    border-bottom-left-radius:4px;
    color:var(--text-primary);
  }
  .msg-row.user .bubble{
    background:linear-gradient(135deg,var(--teal),var(--sage));
    color:#08130c;
    border-bottom-right-radius:4px;
    font-weight:500;
  }
  .msg-time{font-size:11px;color:var(--text-muted);margin-top:4px;display:block;}

  .input-bar{
    display:flex;align-items:center;gap:10px;
    padding:14px 16px;
    border-top:1px solid var(--border);
    background:var(--bg);
  }
  .input-bar input{
    flex:1;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:12px 18px;
    color:var(--text-primary);
    font-size:15px;
    outline:none;
  }
  .input-bar input:focus{border-color:var(--teal);}
  .send-btn{
    width:42px;height:42px;border-radius:50%;
    background:linear-gradient(135deg,var(--teal),var(--sage));
    border:none;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
    box-shadow:0 2px 10px rgba(67,192,160,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
  }

  ::-webkit-scrollbar{width:0;}

  @media (min-width: 1024px){
    body{display:flex;align-items:center;justify-content:center;}
    .app{
      max-width:none;
      width:100%;
      box-shadow:none;
      animation:none;
    }
  }
</style>
</head>
<body>

<div class="app">
  <!-- Màn hình Đăng nhập (Ví dụ mẫu) -->
  <div class="screen active" id="screen-login">
    <div class="logo-wrap">
      <i class="fa-solid fa-robot" style="font-size: 64px; color: var(--teal);"></i>
    </div>
    <div class="brand-name">Zeno AI</div>
    <div class="brand-tag">Trợ lý trí tuệ nhân tạo của bạn</div>

    <div class="auth-body">
      <div class="field">
        <label>Email</label>
        <input type="email" placeholder="nhapemail@gmail.com">
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <input type="password" placeholder="••••••••">
      </div>
      <button class="btn-primary" onclick="document.getElementById('screen-login').classList.remove('active'); document.getElementById('screen-chat').classList.add('active');">Đăng nhập</button>
    </div>
  </div>

  <!-- Màn hình Chat chính -->
  <div class="screen chat-screen" id="screen-chat">
    <div class="chat-header">
      <i class="fa-solid fa-robot" style="font-size: 28px; color: var(--teal);"></i>
      <div class="chat-header-info">
        <div class="chat-header-name">Zeno Gốc</div>
        <div class="chat-header-status"><span class="status-dot"></span> Đang hoạt động</div>
      </div>
      <div class="icon-btn"><i class="fa-solid fa-gear"></i></div>
    </div>
    
    <div class="messages">
      <div class="msg-row bot">
        <div class="bubble">Chào bạn! Tôi là Zeno, tôi có thể giúp gì cho bạn hôm nay?</div>
      </div>
    </div>

    <div class="input-bar">
      <div class="icon-btn"><i class="fa-solid fa-plus"></i></div>
      <input type="text" placeholder="Nhắn tin cho Zeno...">
      <button class="send-btn"><i class="fa-solid fa-paper-plane" style="color: #08130c;"></i></button>
    </div>
  </div>
</div>

</body>
</html>
